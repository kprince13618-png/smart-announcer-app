name: Build Smart Announcer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Complete Android Project
      run: |
        mkdir -p app/src/main/java/com/smart/announcer
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SmartAnnouncerApp"
        include ':app'
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.smart.announcer'
            compileSdk 34
            defaultConfig {
                applicationId "com.smart.announcer"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BATTERY_STATS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_idle_charging"
                android:label="Smart Announcer"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".AnnouncerService"
                    android:enabled="true"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        # 5. Strings
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Smart  Announcer</string>
        </resources>
        EOF

        # 6. Layout UI
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="स्मार्ट समय और बैटरी अनाउंसर"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="24dp" />
            <Switch
                android:id="@+id/switchBattery"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="बैटरी व चार्जर घोषणा (हिंदी में)"
                android:checked="true"
                android:textSize="18sp"
                android:layout_marginBottom="16dp" />
            <Switch
                android:id="@+id/switchTimeDetails"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="समय के साथ दिन व तारीख बोलें"
                android:checked="true"
                android:textSize="18sp"
                android:layout_marginBottom="24dp" />
            <Button
                android:id="@+id/btnTest"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="आवाज़ टेस्ट करें (अभी सुनें)" />
        </LinearLayout>
        EOF

        # 7. AnnouncerService.java
        cat << 'EOF' > app/src/main/java/com/smart/announcer/AnnouncerService.java
        package com.smart.announcer;

        import android.app.Service;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentFilter;
        import android.os.BatteryManager;
        import android.os.IBinder;
        import android.speech.tts.TextToSpeech;
        import java.text.SimpleDateFormat;
        import java.util.Date;
        import java.util.Locale;

        public class AnnouncerService extends Service implements TextToSpeech.OnInitListener {
            private TextToSpeech tts;
            private boolean isTtsReady = false;

            private BroadcastReceiver batteryReceiver = new BroadcastReceiver() {
                @Override
                public void onReceive(Context context, Intent intent) {
                    String action = intent.getAction();
                    int level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                    if (Intent.ACTION_POWER_CONNECTED.equals(action)) {
                        speak("चार्जर कनेक्ट हो गया है। बैटरी " + level + " प्रतिशत चार्ज है।");
                    } else if (Intent.ACTION_POWER_DISCONNECTED.equals(action)) {
                        speak("चार्जर हटा दिया गया है। बैटरी स्तर " + level + " प्रतिशत है।");
                    }
                }
            };

            @Override
            public void onCreate() {
                super.onCreate();
                tts = new TextToSpeech(this, this);
                IntentFilter filter = new IntentFilter();
                filter.addAction(Intent.ACTION_POWER_CONNECTED);
                filter.addAction(Intent.ACTION_POWER_DISCONNECTED);
                registerReceiver(batteryReceiver, filter);
            }

            @Override
            public void onInit(int status) {
                if (status == TextToSpeech.SUCCESS) {
                    tts.setLanguage(new Locale("hi", "IN"));
                    isTtsReady = true;
                }
            }

            public void speak(String text) {
                 if (isTtsReady && tts != null) {
                    tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "ANN_ID");
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                if (intent != null && intent.getBooleanExtra("TEST_SPEAK", false)) {
                    boolean withDate = intent.getBooleanExtra("WITH_DATE", true);
                    announceCurrentTime(withDate);
                }
                return START_STICKY;
            }

            private void announceCurrentTime(boolean withDate) {
                SimpleDateFormat timeFormat = new SimpleDateFormat("hh बजकर mm मिनट", new Locale("hi", "IN"));
                String currentTime = timeFormat.format(new Date());
                String message;
                if (withDate) {
                    SimpleDateFormat dayFormat = new SimpleDateFormat("EEEE, d MMMM yyyy", new Locale("hi", "IN"));
                    String currentDay = dayFormat.format(new Date());
                    message = "समय है " + currentTime + "। आज " + currentDay + " है।";
                } else {
                    message = "समय है " + currentTime;
                }
                speak(message);
            }

            @Override
            public void onDestroy() {
                unregisterReceiver(batteryReceiver);
                if (tts != null) {
                    tts.stop();
                    tts.shutdown();
                }
                super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF

        # 8. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/smart/announcer/MainActivity.java
        package com.smart.announcer;

        import android.content.Intent;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.Switch;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                Intent serviceIntent = new Intent(this, AnnouncerService.class);
                startService(serviceIntent);

                Switch switchTimeDetails = findViewById(R.id.switchTimeDetails);
                Button btnTest = findViewById(R.id.btnTest);

                btnTest.setOnClickListener(v -> {
                    Intent testIntent = new Intent(this, AnnouncerService.class);
                    testIntent.putExtra("TEST_SPEAK", true);
                    testIntent.putExtra("WITH_DATE", switchTimeDetails.isChecked());
                    startService(testIntent);
                });
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Announcer-APK
        path:  app/build/outputs/apk/debug/app-debug.apk
